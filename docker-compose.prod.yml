services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ademo_eleitoral}
      POSTGRES_USER: ${POSTGRES_USER:-ademo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ademo-eleitoral-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ademo-eleitoral-backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  backend-web:
    build:
      context: ./ademo-eleitoral-backend
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - backend_storage:/var/www/html/storage:ro

  queue:
    build:
      context: ./ademo-eleitoral-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ademo-eleitoral-backend/.env.production
    environment:
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--queue=notifications,mail,default", "--sleep=3", "--tries=3", "--timeout=90", "--backoff=60", "--memory=256", "--max-time=3600"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  scheduler:
    build:
      context: ./ademo-eleitoral-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ademo-eleitoral-backend/.env.production
    environment:
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  reverb:
    build:
      context: ./ademo-eleitoral-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ademo-eleitoral-backend/.env.production
    environment:
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  frontend:
    build:
      context: ./ademo-eleitoral-frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Sistema Eleitoral ADEMO}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-ademo_key}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-80}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend-web
      - reverb

volumes:
  postgres_data:
  backend_storage:
  backend_cache:
